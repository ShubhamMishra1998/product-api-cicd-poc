services:

  product-api-blue:
    image: ${BLUE_IMAGE:-ghcr.io/shubhammishra1998/product-api-cicd-poc:sha-a7dd529}
    container_name: product-api-blue
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"

  product-api-green:
    image: ${GREEN_IMAGE:-ghcr.io/shubhammishra1998/product-api-cicd-poc:sha-a7dd529}
    container_name: product-api-green
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: product-api-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - C:/product-api-deployment/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - product-api-blue
      - product-api-green
