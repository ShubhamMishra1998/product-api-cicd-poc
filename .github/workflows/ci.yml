name: Product API - CI and Docker Publishing

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  # JOB 1: Build and test
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-api-test-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: warn
          retention-days: 7

  # JOB 2: Build and publish Docker image
  publish-docker-image:
    name: Build and Publish Docker Image
    needs: build-and-test

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/shubhammishra1998/product-api-cicd-poc
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Set deployment image reference
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/shubhammishra1998/product-api-cicd-poc:sha-${GITHUB_SHA::7}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 3: Deploy after manual approval
  deploy-local:
    name: Deploy to Local Rancher Desktop

    needs: publish-docker-image

    runs-on: [self-hosted, Windows, X64, rancher]

    environment:
      name: local-deployment

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy using Blue-Green strategy
        shell: pwsh
        run: |
          $image = "${{ needs.publish-docker-image.outputs.image }}"

          Write-Host "Starting Blue-Green deployment"
          Write-Host "Image: $image"

          .\scripts\deploy-blue-green.ps1 -Image $image

      - name: Verify application through Nginx
        shell: pwsh
        run: |
          $response = Invoke-RestMethod `
            -Uri "http://localhost:8081/actuator/health" `
            -TimeoutSec 10

          if ($response.status -ne "UP") {
              throw "Application health verification failed"
          }

          Write-Host "Deployment verification successful!"
          Write-Host "Application status: $($response.status)"
