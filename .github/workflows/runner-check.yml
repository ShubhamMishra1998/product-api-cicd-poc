name: Local Runner - Docker Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-runner:

    name: Verify Local Rancher Runner

    runs-on: [self-hosted, Windows, X64, rancher]

    steps:

      - name: Check runner
        shell: cmd
        run: echo Local Rancher Runner is working

      - name: Verify Docker CLI
        shell: cmd
        run: docker --version

      - name: Verify Docker Compose
        shell: cmd
        run: docker compose version

      - name: Verify Docker daemon
        shell: cmd
        run: docker info

      - name: List running containers
        shell: cmd
        run: docker ps
